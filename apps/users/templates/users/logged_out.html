{% extends "base.html" %}

{% block title %}{{ t.logout }}{% endblock %}

{% block content %}
<section class="auth-page">
    <div class="container">
        <div class="auth-shell single-panel">
            <div class="auth-form-panel fade-up">
                <div class="auth-card text-center">
                    <h2>{{ t.logged_out }}</h2>
                    <p class="mb-4">{{ t.hero_subtitle }}</p>
                    <a href="{% url 'login' %}" class="btn btn-primary-gradient mb-2 w-100">{{ t.login }}</a>
                    <a href="{% url 'home' %}" class="btn btn-outline-light w-100">{{ t.home }}</a>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
