<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 | Server xatoligi</title>
    <style>
        :root {
            --bg: #070b1a;
            --card: linear-gradient(135deg, rgba(22, 28, 57, 0.96), rgba(16, 22, 46, 0.96));
            --border: rgba(255,255,255,.08);
            --text: #f4f7fb;
            --muted: #aeb7cc;
            --accent-1: #7c5cff;
            --accent-2: #7cb7ff;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Inter, Arial, sans-serif;
            background:
                radial-gradient(circle at top left, rgba(124, 92, 255, 0.16), transparent 28%),
                radial-gradient(circle at top right, rgba(93, 170, 255, 0.12), transparent 24%),
                var(--bg);
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .error-shell {
            width: min(760px, 100%);
        }

        .error-card {
            padding: 44px 30px;
            border-radius: 28px;
            background: var(--card);
            border: 1px solid var(--border);
            box-shadow: 0 18px 48px rgba(0,0,0,.28);
            text-align: center;
        }

        .error-code {
            font-size: clamp(4rem, 10vw, 7rem);
            line-height: 1;
            font-weight: 900;
            margin-bottom: 14px;
            background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .error-title {
            margin: 0 0 12px;
            font-size: clamp(1.8rem, 4vw, 2.8rem);
            font-weight: 900;
        }

        .error-text {
            max-width: 560px;
            margin: 0 auto 26px;
            color: var(--muted);
            font-size: 1rem;
            line-height: 1.75;
        }

        .error-actions {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .error-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 48px;
            padding: 0 22px;
            border-radius: 999px;
            text-decoration: none;
            font-weight: 700;
            transition: transform .18s ease, opacity .18s ease, box-shadow .18s ease;
        }

        .error-btn:hover {
            transform: translateY(-1px);
        }

        .error-btn--primary {
            color: #fff;
            background: linear-gradient(90deg, var(--accent-1), var(--accent-2));
            box-shadow: 0 10px 30px rgba(124, 92, 255, 0.25);
        }

        @media (max-width: 767px) {
            .error-card {
                padding: 34px 18px;
                border-radius: 22px;
            }

            .error-actions {
                flex-direction: column;
            }

            .error-btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="error-shell">
        <div class="error-card">
            <div class="error-code">500</div>
            <h1 class="error-title">Server xatoligi</h1>
            <p class="error-text">
                Ichki xatolik sababli sahifani yuklab bo‘lmadi.
                Iltimos, keyinroq qayta urinib ko‘ring.
            </p>

            <div class="error-actions">
                <a href="/" class="error-btn error-btn--primary">Bosh sahifaga qaytish</a>
            </div>
        </div>
    </div>
</body>
</html>
