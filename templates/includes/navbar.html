<nav class="navbar navbar-expand-lg app-navbar">
    <div class="container">
        <a class="navbar-brand brand-mark" href="{% url 'home' %}">
            <span class="brand-dot"></span>
            {{ t.site_name }}
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="mainNav">
            <ul class="navbar-nav me-auto align-items-lg-center">
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'home' %}">{{ t.home }}</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'movie_list' %}">{{ t.movies }}</a>
                </li>
            </ul>

            <div class="d-flex align-items-center gap-2 nav-actions">
                <div class="dropdown">
                    <button class="btn btn-ghost dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                        {{ t.language }}: {{ ui_lang|upper }}
                    </button>
                    <ul class="dropdown-menu dropdown-menu-dark">
                        {% for code, label in available_languages %}
                            <li>
                                <a class="dropdown-item" href="{% url 'set_language' code %}?next={{ request.get_full_path|urlencode }}">
                                    {{ label }}
                                </a>
                            </li>
                        {% endfor %}
                    </ul>
                </div>

                <button
                    id="themeToggle"
                    class="btn btn-ghost"
                    type="button"
                    data-label-dark="{{ t.dark_mode }}"
                    data-label-light="{{ t.light_mode }}"
                    aria-label="{{ t.light_mode }}"
                    title="{{ t.light_mode }}"
                >
                    <span class="theme-toggle-label">{{ t.light_mode }}</span>
                </button>

                {% if user.is_authenticated %}
                    <a class="btn btn-outline-light" href="{% url 'profile' %}">{{ t.profile }}</a>
                    <form method="post" action="{% url 'logout' %}" class="d-inline">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-primary-gradient">{{ t.logout }}</button>
                    </form>
                {% else %}
                    <a class="btn btn-outline-light" href="{% url 'login' %}">{{ t.login }}</a>
                    <a class="btn btn-primary-gradient" href="{% url 'register' %}">{{ t.register }}</a>
                {% endif %}
            </div>
        </div>
    </div>
</nav>
