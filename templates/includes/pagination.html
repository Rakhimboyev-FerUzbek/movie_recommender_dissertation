{% if page_obj.paginator.num_pages > 1 %}
<nav class="pagination-wrap" aria-label="Pagination">
    {% if page_obj.has_previous %}
        <a class="pagination-link" href="?{% if pagination_query %}{{ pagination_query }}&{% endif %}page={{ page_obj.previous_page_number }}">
            ←
        </a>
    {% else %}
        <span class="pagination-link is-disabled">←</span>
    {% endif %}

    {% for number in page_numbers %}
        {% if number == page_obj.number %}
            <span class="pagination-link is-active">{{ number }}</span>
        {% else %}
            <a class="pagination-link" href="?{% if pagination_query %}{{ pagination_query }}&{% endif %}page={{ number }}">
                {{ number }}
            </a>
        {% endif %}
    {% endfor %}

    {% if page_obj.has_next %}
        <a class="pagination-link" href="?{% if pagination_query %}{{ pagination_query }}&{% endif %}page={{ page_obj.next_page_number }}">
            →
        </a>
    {% else %}
        <span class="pagination-link is-disabled">→</span>
    {% endif %}
</nav>
{% endif %}
