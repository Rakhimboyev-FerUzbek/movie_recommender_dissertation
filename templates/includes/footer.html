<footer class="app-footer mt-5">
    <div class="container py-4">
        <div class="d-flex flex-column flex-md-row justify-content-between align-items-center gap-3">
            <div>
                <h6 class="mb-1">{{ t.site_name }}</h6>
                <small class="text-muted">{{ t.cinematic_experience }}</small>
            </div>
            <div class="footer-links d-flex gap-3">
                <a href="{% url 'home' %}">{{ t.home }}</a>
                <a href="{% url 'movie_list' %}">{{ t.movies }}</a>
                {% if user.is_authenticated %}
                    <a href="{% url 'profile' %}">{{ t.profile }}</a>
                {% endif %}
            </div>
        </div>
    </div>
</footer>
