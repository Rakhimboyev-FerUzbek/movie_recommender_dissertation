{% load static %}
<!DOCTYPE html>
<html lang="{{ ui_lang|default:'uz' }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ t.site_name|default:"Movie Recommender" }}{% endblock %}</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{% static 'css/theme.css' %}">
    <link rel="stylesheet" href="{% static 'css/layout.css' %}">
    <link rel="stylesheet" href="{% static 'css/components.css' %}">
    <link rel="stylesheet" href="{% static 'css/pages.css' %}">
</head>
<body data-theme="dark">
    <div class="app-shell">
        {% include "includes/navbar.html" %}

        <main class="main-content">
            {% if messages %}
                <div class="container pt-3">
                    {% for message in messages %}
                        <div class="alert-pill alert-{{ message.tags|default:'info' }}">
                            {{ message }}
                        </div>
                    {% endfor %}
                </div>
            {% endif %}

            {% block content %}{% endblock %}
        </main>

        {% include "includes/footer.html" %}
    </div>

    <!-- Scroll to top button -->
    <button id="scrollTopBtn" aria-label="Tepaga qaytish" title="Tepaga qaytish">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M10 15V5M10 5L5 10M10 5L15 10" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
    </button>

    <style>
    #scrollTopBtn {
        position: fixed;
        bottom: 28px;
        right: 28px;
        z-index: 9990;
        width: 48px;
        height: 48px;
        border-radius: 50%;
        border: 1px solid rgba(124, 92, 255, 0.35);
        background: rgba(11, 16, 32, 0.82);
        color: #a58fff;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        backdrop-filter: blur(14px);
        box-shadow: 0 8px 28px rgba(0, 0, 0, 0.32), 0 0 0 1px rgba(124, 92, 255, 0.12);
        opacity: 0;
        transform: translateY(14px) scale(0.85);
        transition: opacity 0.28s ease, transform 0.28s cubic-bezier(.34,1.56,.64,1),
                    border-color 0.2s, background 0.2s, box-shadow 0.2s;
        pointer-events: none;
    }

    body[data-theme="light"] #scrollTopBtn {
        background: rgba(255, 255, 255, 0.88);
        border-color: rgba(124, 92, 255, 0.28);
        color: #5b4bff;
    }

    #scrollTopBtn.is-visible {
        opacity: 1;
        transform: translateY(0) scale(1);
        pointer-events: all;
    }

    #scrollTopBtn:hover {
        border-color: rgba(124, 92, 255, 0.65);
        background: rgba(124, 92, 255, 0.18);
        color: #d0c2ff;
        box-shadow: 0 12px 36px rgba(124, 92, 255, 0.28), 0 0 0 1px rgba(124, 92, 255, 0.22);
        transform: translateY(-3px) scale(1.08);
    }

    body[data-theme="light"] #scrollTopBtn:hover {
        background: rgba(124, 92, 255, 0.1);
        color: #4b35d4;
    }

    #scrollTopBtn:active {
        transform: translateY(0) scale(0.96);
    }

    @media (max-width: 767px) {
        #scrollTopBtn {
            bottom: 20px;
            right: 16px;
            width: 44px;
            height: 44px;
        }
    }
    </style>

    <script>
    (function () {
        const btn = document.getElementById('scrollTopBtn');
        if (!btn) return;

        const SHOW_AFTER = 320;

        function onScroll() {
            if (window.scrollY > SHOW_AFTER) {
                btn.classList.add('is-visible');
            } else {
                btn.classList.remove('is-visible');
            }
        }

        window.addEventListener('scroll', onScroll, { passive: true });
        onScroll();

        btn.addEventListener('click', function () {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });
    })();
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'js/theme.js' %}"></script>
    <script src="{% static 'js/main.js' %}"></script>
</body>
</html>
