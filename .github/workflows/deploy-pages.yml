name: Deploy github_pages_export to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "github_pages_export/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "github-pages"
  cancel-in-progress: false

jobs:
  deploy:
    name: Validate and deploy static export
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate exported site
        shell: bash
        run: |
          set -e

          if [ ! -d "github_pages_export" ]; then
            echo "ERROR: github_pages_export folder not found."
            exit 1
          fi

          if [ ! -f "github_pages_export/index.html" ]; then
            echo "ERROR: github_pages_export/index.html not found."
            exit 1
          fi

          touch github_pages_export/.nojekyll

          HTML_COUNT=$(find github_pages_export -name "*.html" | wc -l)
          echo "HTML files count: $HTML_COUNT"

          if [ "$HTML_COUNT" -lt 5 ]; then
            echo "ERROR: Too few HTML files. Export may be incomplete."
            exit 1
          fi

          if grep -RInE "http://127\.0\.0\.1:8000|http://localhost:8000|127\.0\.0\.1:8000|localhost:8000" github_pages_export --include="*.html"; then
            echo "ERROR: localhost links found in exported HTML."
            exit 1
          fi

          echo "Validation passed."

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: github_pages_export

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4